<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲸檬 · 运营面板</title>
<style>
  :root{
    --bg:#070b14; --bg2:#0b1120; --card:#0f1728; --card2:#131d31; --line:#1e2b44; --line2:#2a3a5a;
    --fg:#eaf0fb; --fg2:#a3b2cc; --fg3:#6b7d9c;
    --accent:#4fd1ff; --pink:#ff7aa2; --green:#4ade80; --amber:#f5c45d; --red:#ff6b62; --purple:#b78bff;
    --accent-dim:rgba(79,209,255,.13); --accent-line:rgba(79,209,255,.32);
    --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -14px rgba(0,0,0,.55);
    --shadow-hover:0 2px 0 rgba(255,255,255,.06) inset, 0 18px 42px -16px rgba(0,0,0,.65);
    --r:14px; --r-sm:10px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  ::selection{background:rgba(79,209,255,.28)}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.65;
    background-image:
      radial-gradient(ellipse 1000px 560px at 12% -12%, rgba(79,209,255,.1), transparent 62%),
      radial-gradient(ellipse 760px 460px at 88% -6%, rgba(255,122,162,.08), transparent 60%),
      radial-gradient(ellipse 900px 500px at 50% 115%, rgba(183,139,255,.06), transparent 65%);
    background-attachment:fixed;
  }
  .wrap{max-width:1320px;margin:0 auto;padding:0 24px 80px}

  /* ── 顶栏 ── */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:24px 0 20px;margin-bottom:24px;flex-wrap:wrap;
    border-bottom:1px solid rgba(30,43,68,.7);
    background:linear-gradient(to bottom, rgba(15,23,40,.35), transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:14px}
  .avatar{
    width:48px;height:48px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(135deg,#155e8a 0%,#0d2a44 55%,#3b1d5e 100%);
    border:1px solid rgba(79,209,255,.45);
    display:grid;place-items:center;font-size:23px;
    box-shadow:0 0 0 4px rgba(79,209,255,.08), 0 8px 24px -6px rgba(79,209,255,.35);
    transition:transform .25s ease;
  }
  .avatar:hover{transform:scale(1.06) rotate(-3deg)}
  .brand h1{font-size:20px;font-weight:720;letter-spacing:-.015em;line-height:1.2}
  .brand h1 .dim{color:var(--fg3);font-weight:400;font-size:13px;letter-spacing:0}
  .brand .sub{font-size:12.5px;color:var(--fg3);margin-top:3px}
  .brand .sub .mono{color:var(--fg2)}
  .hdr-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .clock{text-align:right}
  .clock .t{font-size:18px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--fg)}
  .clock .d{font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
  .refresh{
    cursor:pointer;border:1px solid var(--line2);background:linear-gradient(to bottom,var(--card2),var(--card));
    color:var(--accent);font-size:12.5px;font-weight:620;padding:8px 16px;border-radius:10px;
    transition:.18s;font-family:inherit;box-shadow:var(--shadow);
    display:inline-flex;align-items:center;gap:6px;
  }
  .refresh:hover{background:var(--accent-dim);border-color:var(--accent-line);transform:translateY(-1px)}
  .refresh:active{transform:translateY(0) scale(.98)}
  .refresh .ico{transition:transform .6s cubic-bezier(.4,0,.2,1)}
  .refresh:hover .ico{transform:rotate(180deg)}

  /* ── 状态条 ── */
  .statusbar{
    display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:28px;
  }
  @media(max-width:1200px){.statusbar{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:760px){.statusbar{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.statusbar{grid-template-columns:1fr}}
  .stat{
    background:linear-gradient(to bottom, rgba(21,30,49,.9), rgba(15,23,40,.9));
    border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
    position:relative;overflow:hidden;box-shadow:var(--shadow);
    transition:border-color .2s, transform .2s, box-shadow .2s;
  }
  .stat::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--accent);opacity:.85;border-radius:0 3px 3px 0;
  }
  .stat::after{
    content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle, rgba(79,209,255,.07), transparent 70%);
    pointer-events:none;
  }
  .stat.warn::before{background:var(--amber)}
  .stat.off::before{background:var(--fg3)}
  .stat:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow-hover)}
  .stat .k{font-size:11px;color:var(--fg3);letter-spacing:.09em;text-transform:uppercase;font-weight:650;margin-bottom:8px;display:flex;align-items:center;gap:5px}
  .stat .v{font-size:21px;font-weight:730;font-variant-numeric:tabular-nums;line-height:1.22;letter-spacing:-.01em}
  .stat .v.sm{font-size:15.5px;line-height:1.4}
  .stat .n{font-size:12px;color:var(--fg2);margin-top:6px}

  /* ── 双栏布局 ── */
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
  @media(max-width:1080px){.cols{grid-template-columns:1fr}}
  .col-main{display:flex;flex-direction:column;gap:0;min-width:0}
  .col-side{display:flex;flex-direction:column;gap:0;min-width:0;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:2px}
  @media(max-width:1080px){.col-side{position:static;max-height:none;overflow:visible}}
  .col-side section{background:linear-gradient(to bottom, rgba(18,27,46,.5), rgba(13,19,34,.5));border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 8px;margin-bottom:22px;box-shadow:var(--shadow)}
  .col-main section{margin-bottom:26px}

  /* ── 区块 ── */
  section{margin-bottom:26px}
  h2{
    font-size:15px;font-weight:680;letter-spacing:.005em;margin-bottom:15px;
    display:flex;align-items:center;gap:10px;
  }
  h2 .bar{width:4px;height:16px;background:linear-gradient(to bottom,var(--accent),rgba(79,209,255,.25));border-radius:3px;box-shadow:0 0 10px rgba(79,209,255,.45)}
  h2 .cnt{
    font-size:11px;font-weight:650;color:var(--fg3);
    background:var(--card);border:1px solid var(--line2);padding:2px 9px;border-radius:999px;
    font-variant-numeric:tabular-nums;
  }

  /* ── 卡片 ── */
  .grid{display:grid;gap:15px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
  .card{
    background:linear-gradient(to bottom, var(--card2), var(--card));
    border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;
    box-shadow:var(--shadow);transition:border-color .2s, transform .2s, box-shadow .2s;
  }
  .card:hover{border-color:var(--line2)}
  .card h3{font-size:13px;font-weight:660;margin-bottom:13px;display:flex;align-items:center;gap:8px;color:var(--fg)}
  .card p{font-size:13px;color:var(--fg2)}

  /* ── 时间线 ── */
  .timeline{position:relative;padding-left:28px}
  .timeline::before{
    content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1.5px;
    background:linear-gradient(to bottom, rgba(79,209,255,.4), rgba(79,209,255,.05));
    border-radius:2px;
  }
  .ev{position:relative;margin-bottom:3px}
  .ev .dot{
    position:absolute;left:-26px;top:14px;width:10px;height:10px;border-radius:50%;
    background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 1.5px rgba(79,209,255,.4), 0 0 10px rgba(79,209,255,.4);
  }
  .ev.k-risk .dot,.ev.k-error .dot{background:var(--red);box-shadow:0 0 0 1.5px rgba(255,107,98,.45),0 0 10px rgba(255,107,98,.4)}
  .ev.k-night .dot{background:var(--purple);box-shadow:0 0 0 1.5px rgba(183,139,255,.45),0 0 10px rgba(183,139,255,.4)}
  .ev.k-feed .dot{background:var(--green);box-shadow:0 0 0 1.5px rgba(74,222,128,.45),0 0 10px rgba(74,222,128,.35)}
  .ev.k-debrief .dot{background:var(--accent);box-shadow:0 0 0 1.5px rgba(79,209,255,.45),0 0 10px rgba(79,209,255,.35)}
  .ev.k-interact .dot{background:var(--pink);box-shadow:0 0 0 1.5px rgba(255,122,162,.45),0 0 10px rgba(255,122,162,.35)}
  .ev.k-diary .dot{background:var(--amber);box-shadow:0 0 0 1.5px rgba(245,196,93,.45),0 0 10px rgba(245,196,93,.35)}

  .ev .row{
    display:flex;align-items:baseline;gap:11px;padding:10px 14px;border-radius:10px;
    transition:background .16s;flex-wrap:wrap;
  }
  .ev .row:hover{background:rgba(79,209,255,.05)}
  .ev .time{
    font-family:var(--mono);font-size:11.5px;color:var(--fg3);flex:0 0 auto;font-variant-numeric:tabular-nums;
  }
  .ev .kind{
    font-family:var(--mono);font-size:11px;font-weight:620;
    padding:2px 8px;border-radius:6px;flex:0 0 auto;
    background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-line);
  }
  .ev.k-risk .kind,.ev.k-error .kind{background:rgba(255,107,98,.13);color:var(--red);border-color:rgba(255,107,98,.3)}
  .ev.k-night .kind{background:rgba(183,139,255,.13);color:var(--purple);border-color:rgba(183,139,255,.3)}
  .ev.k-feed .kind{background:rgba(74,222,128,.13);color:var(--green);border-color:rgba(74,222,128,.3)}
  .ev.k-interact .kind{background:rgba(255,122,162,.13);color:var(--pink);border-color:rgba(255,122,162,.3)}
  .ev.k-diary .kind{background:rgba(245,196,93,.13);color:var(--amber);border-color:rgba(245,196,93,.3)}
  .ev .text{font-size:13.5px;color:var(--fg2);flex:1;min-width:200px}
  .ev .text b{color:var(--fg);font-weight:600}
  .ev .tg{
    font-family:var(--mono);font-size:11px;color:var(--fg3);
    background:rgba(107,125,156,.13);padding:2px 7px;border-radius:5px;
    flex:0 1 auto;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ev .daytag{
    font-family:var(--mono);font-size:10.5px;color:var(--fg3);
    background:rgba(107,125,156,.1);padding:1.5px 6px;border-radius:4px;
  }

  /* ── 健康检查 ── */
  .check{display:flex;align-items:flex-start;gap:11px;padding:8px 2px;border-bottom:1px solid rgba(30,43,68,.55);font-size:13px}
  .check:last-child{border-bottom:none}
  .check .ic{flex:0 0 auto;font-size:13px;line-height:1.5;width:17px}
  .check .nm{flex:0 0 auto;color:var(--fg2);min-width:86px;font-weight:520}
  .check .dt{flex:1;color:var(--fg3);font-size:12.5px;font-family:var(--mono)}
  .check.ok .ic{color:var(--green)}
  .check.no .ic{color:var(--amber)}

  /* ── 日记卡 ── */
  .diaryitem{
    background:linear-gradient(to bottom, var(--card2), var(--card));
    border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow);
    transition:border-color .2s;
  }
  .diaryitem:hover{border-color:var(--line2)}
  .diaryitem .head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .diaryitem .st{
    font-size:11px;font-weight:650;padding:2.5px 10px;border-radius:999px;
    border:1px solid transparent;
  }
  .st.pending{background:rgba(245,196,93,.14);color:var(--amber);border-color:rgba(245,196,93,.32)}
  .st.approved{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-line)}
  .st.published{background:rgba(74,222,128,.14);color:var(--green);border-color:rgba(74,222,128,.32)}
  .st.rejected{background:rgba(255,107,98,.13);color:var(--red);border-color:rgba(255,107,98,.3)}
  .diaryitem .meta{font-size:11.5px;color:var(--fg3);font-family:var(--mono)}
  .diaryitem .body{
    font-size:13.5px;color:var(--fg2);line-height:1.9;white-space:pre-wrap;
    max-height:210px;overflow:hidden;position:relative;
    padding-bottom:12px;
  }
  .diaryitem.open .body{max-height:none}
  .diaryitem .body::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:52px;
    background:linear-gradient(to bottom,transparent,var(--card2));
  }
  .diaryitem.open .body::after{display:none}
  .expand{
    cursor:pointer;background:none;border:1px solid var(--line2);color:var(--accent);font-size:12px;
    font-weight:620;padding:5px 12px;border-radius:8px;font-family:inherit;margin-top:8px;
    transition:all .16s;
  }
  .expand:hover{text-decoration:none;background:var(--accent-dim);border-color:var(--accent-line);transform:translateY(-1px)}

  /* ── 表格 ── */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{
    text-align:left;padding:9px 12px;font-size:11px;color:var(--fg3);
    font-weight:640;letter-spacing:.07em;text-transform:uppercase;
    border-bottom:1px solid var(--line2);
  }
  td{padding:10px 12px;border-bottom:1px solid rgba(30,43,68,.5);color:var(--fg2);vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(79,209,255,.03)}
  td b{color:var(--fg);font-weight:600}
  .mono{font-family:var(--mono);font-size:11.5px}
  .tag{
    font-size:11px;font-weight:620;color:var(--accent);
    background:var(--accent-dim);border:1px solid var(--accent-line);
    padding:2px 9px;border-radius:999px;white-space:nowrap;
  }

  /* ── 筛选器 ── */
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}
  .fbtn{
    cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;
    padding:5.5px 13px;border-radius:9px;transition:.16s;
    background:var(--card);border:1px solid var(--line);color:var(--fg2);
  }
  .fbtn:hover{border-color:var(--accent-line);color:var(--fg);transform:translateY(-1px)}
  .fbtn.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent);box-shadow:0 0 0 1px rgba(79,209,255,.12) inset}
  .fbtn .n{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}

  /* ── 空态 ── */
  .empty{
    text-align:center;padding:42px 20px;color:var(--fg3);font-size:13.5px;
    background:linear-gradient(to bottom, var(--card), rgba(15,23,40,.4));
    border:1px dashed var(--line2);border-radius:var(--r);
  }
  .empty .big{font-size:32px;margin-bottom:12px;opacity:.5}

  footer{
    margin-top:50px;padding-top:22px;border-top:1px solid rgba(30,43,68,.6);
    font-size:11.5px;color:var(--fg3);display:flex;justify-content:space-between;
    flex-wrap:wrap;gap:10px;font-family:var(--mono);
  }

  /* 加载/错误 */
  #boot{text-align:center;padding:90px 20px;color:var(--fg3)}
  #boot .sp{
    width:30px;height:30px;margin:0 auto 18px;border-radius:50%;
    border:2.5px solid rgba(79,209,255,.18);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot .err{color:var(--amber);font-size:13.5px;line-height:1.9;max-width:520px;margin:0 auto}
  #boot code{
    font-family:var(--mono);background:var(--accent-dim);
    color:var(--accent);padding:2px 6px;border-radius:4px;font-size:12.5px;
  }

  /* 区块渐入 */
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  section{animation:fadeUp .35s ease both}
  .stat{animation:fadeUp .4s ease both}
  section:nth-child(2){animation-delay:.03s}
  section:nth-child(3){animation-delay:.06s}
  section:nth-child(4){animation-delay:.09s}
  section:nth-child(5){animation-delay:.12s}

  /* 滚动条 */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#23304c;border-radius:99px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#2f3f61}
</style>

</head>
<body>
<div class="wrap">

  <div id="boot">
    <div class="sp"></div>
    <div>正在读取她的状态…</div>
  </div>

  <div id="app" style="display:none"></div>
</div>

<script>
const KIND_GROUP = {
  'night-plan': 'night', 'night-wake': 'night', 'night-skip': 'night',
  'feed': 'feed', 'debrief': 'debrief',
  'interact': 'interact',
  'diary-draft': 'diary', 'diary-push': 'diary', 'diary-approve': 'diary',
  'diary-reject': 'diary', 'diary-publish': 'diary',
  'risk': 'risk', 'error': 'error',
  'dynamic': 'interact', 'notify': 'interact',
};

const KIND_LABEL = {
  'night-plan': '生物钟', 'night-wake': '醒来', 'night-skip': '不看',
  'feed': '选题', 'debrief': '读懂', 'interact': '互动',
  'diary-draft': '写日记', 'diary-push': '推审', 'diary-approve': '批准',
  'diary-reject': '驳回', 'diary-publish': '发布',
  'risk': '风控', 'error': '错误', 'dynamic': '动态', 'notify': '通知',
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hhmm(iso) {
  if (!iso) return '--:--';
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function dayOf(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('sv-SE');
}
function rel(ms) {
  if (ms === null || ms === undefined) return '—';
  const a = Math.abs(ms);
  const m = Math.round(a / 60000);
  if (m < 1) return '不到 1 分钟';
  if (m < 60) return m + ' 分钟';
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return h + ' 小时' + (r ? ' ' + r + ' 分' : '');
  return Math.floor(h / 24) + ' 天 ' + (h % 24) + ' 小时';
}

function render(d) {
  const app = document.getElementById('app');
  const s = d.schedule.current;
  const warmup = d.switches.warmup;

  const okCount = d.checks.filter(c => c.ok).length;
  const total = d.checks.length;

  // 倒计时文案
  let nextTxt = '未排期', nextNote = '';
  if (s && s.planAt) {
    if (s.fired) { nextTxt = '今天已跑完'; nextNote = `计划 ${s.atText}`; }
    else if (s.msUntil > 0) { nextTxt = rel(s.msUntil); nextNote = `预计 ${s.atText} 醒来`; }
    else { nextTxt = '已到点'; nextNote = `计划 ${s.atText} · 等待触发`; }
  }
  if (s && s.roll === 'skip') { nextTxt = '今天不看'; nextNote = '掷骰子掷到了那 30%'; }

  const html = `
  <header>
    <div class="brand">
      <div class="avatar">🐳</div>
      <div>
        <h1>${esc(d.persona.name)} <span style="color:var(--fg3);font-weight:400;font-size:13px">· 运营面板</span></h1>
        <div class="sub">${esc(d.persona.name)} <span class="mono">${esc(d.persona.selfMid ?? '?')}</span> · 主人 <span class="mono">${esc(d.persona.ownerMid ?? '?')}</span></div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="clock">
        <div class="t">${esc(d.now.split(' ')[1] ?? '')}</div>
        <div class="d">${esc(d.now.split(' ')[0] ?? '')}</div>
      </div>
      <button class="refresh" onclick="location.reload()">刷新</button>
    </div>
  </header>

  <!-- 状态条 -->
  <div class="statusbar">
    <div class="stat ${s && s.roll === 'skip' ? 'off' : ''}">
      <div class="k">下次醒来</div>
      <div class="v ${String(nextTxt).length > 8 ? 'sm' : ''}">${esc(nextTxt)}</div>
      <div class="n">${esc(nextNote)}</div>
    </div>
    <div class="stat">
      <div class="k">今日事件</div>
      <div class="v">${d.stats.todayEvents}</div>
      <div class="n">累计 ${d.stats.totalEvents} 条</div>
    </div>
    <div class="stat">
      <div class="k">今天读过</div>
      <div class="v">${d.diary.watched.length}</div>
      <div class="n">想说还没说 ${d.diary.wants.length} 条</div>
    </div>
    <div class="stat ${(d.diary.statusCount.pending ?? 0) > 0 ? 'warn' : ''}">
      <div class="k">待审日记</div>
      <div class="v">${d.diary.statusCount.pending ?? 0}</div>
      <div class="n">已发 ${d.diary.statusCount.published ?? 0} 条</div>
    </div>
    <div class="stat ${warmup ? 'warn' : ''}">
      <div class="k">运行模式</div>
      <div class="v sm">${warmup ? '养号期 · 只看不互动' : '正常运营'}</div>
      <div class="n">分享 ${d.switches.share ? '开' : '关'} · 评论 ${d.switches.listenComment ? '开' : '关'}</div>
    </div>
    <div class="stat ${okCount === total ? '' : 'off'}">
      <div class="k">自检</div>
      <div class="v">${okCount} / ${total}</div>
      <div class="n">${okCount === total ? '全部通过' : (total - okCount) + ' 项待处理'}</div>
    </div>
  </div>

  <!-- 双栏：左主右侧 -->
  <div class="cols">
  <div class="col-main">

  <!-- 事件时间线 -->
  <section>
    <h2><span class="bar"></span>她干了什么<span class="cnt">${d.events.length} 条</span></h2>
    ${d.events.length === 0
      ? `<div class="empty"><div class="big">🌊</div>还没有事件记录。<br>她第一次醒来之后，这里会一条条长出来。</div>`
      : `${(() => {
          const groups = [...new Set(d.events.map(e => KIND_GROUP[e.kind] ?? 'other'))];
          const labelOf = {night:'生物钟',feed:'选题',debrief:'读懂',interact:'互动',diary:'日记',risk:'风控',error:'错误',other:'其他'};
          const counts = {};
          for (const e of d.events) { const g = KIND_GROUP[e.kind] ?? 'other'; counts[g] = (counts[g]??0)+1; }
          return `<div class="filters" id="filters">
            <button class="fbtn on" data-f="all" onclick="filterEvents('all', this)">全部<span class="n">${d.events.length}</span></button>
            ${groups.map(g => `<button class="fbtn" data-f="${g}" onclick="filterEvents('${g}', this)">${labelOf[g] ?? g}<span class="n">${counts[g]}</span></button>`).join('')}
          </div>`;
        })()}
        <div class="timeline" id="timeline">${d.events.map(e => {
          const grp = KIND_GROUP[e.kind] ?? '';
          const label = KIND_LABEL[e.kind] ?? e.kind;
          const dayLabel = dayOf(e.at);
          const isToday = dayLabel === d.generatedAt.slice(0,10);
          return `
          <div class="ev k-${grp}" data-g="${esc(grp || 'other')}">
            <div class="dot"></div>
            <div class="row">
              <span class="time">${hhmm(e.at)}</span>
              <span class="kind">${esc(label)}</span>
              <span class="text">${esc(e.note ?? '')}</span>
              ${e.target ? `<span class="tg">${esc(String(e.target).slice(0, 28))}</span>` : ''}
              ${!isToday ? `<span class="daytag">${esc(dayLabel)}</span>` : ''}
            </div>
          </div>`;
        }).join('')}</div>`
    }
  </section>

  <!-- 日记 -->
  <section>
    <h2><span class="bar"></span>潜水日记<span class="cnt">${d.diary.queue.length} 条</span></h2>
    ${d.diary.queue.length === 0
      ? `<div class="empty"><div class="big">📖</div>还没有写过日记。</div>`
      : [...d.diary.queue].reverse().map((e, i) => `
        <div class="diaryitem" id="di-${i}">
          <div class="head">
            <span class="st ${esc(e.status)}">${esc({pending:'待审',approved:'已批准',published:'已发布',rejected:'已驳回'}[e.status] ?? e.status)}</span>
            <span class="meta">${esc(e.date)} · ${e.chars} 字</span>
            ${e.dynId ? `<span class="meta">· <a href="https://t.bilibili.com/${esc(e.dynId)}" target="_blank" style="color:var(--accent)">B站动态</a></span>` : ''}
          </div>
          <div class="body">${esc(e.text)}</div>
          <button class="expand" onclick="document.getElementById('di-${i}').classList.toggle('open'); this.textContent = document.getElementById('di-${i}').classList.contains('open') ? '收起' : '展开全文';">展开全文</button>
        </div>`).join('')
    }
  </section>

  <!-- 她读过什么 -->
  <section>
    <h2><span class="bar"></span>她读过什么<span class="cnt">${d.diary.watched.length} 条</span></h2>
    ${d.diary.watched.length === 0
      ? `<div class="empty"><div class="big">👀</div>还没读过任何视频。</div>`
      : `<div class="card" style="padding:6px 8px">
          <table>
            <thead><tr><th style="width:88px">日期</th><th style="width:130px">BV</th><th>标题</th><th>她的判断</th></tr></thead>
            <tbody>
              ${d.diary.watched.map(w => `
                <tr>
                  <td class="mono">${esc(w.date)}</td>
                  <td class="mono"><a href="https://www.bilibili.com/video/${esc(w.bv)}/" target="_blank" style="color:var(--fg3);font-size:11px">${esc(w.bv)}</a></td>
                  <td><b>${esc(w.title)}</b></td>
                  <td style="font-size:12.5px">${esc(w.thought)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`
    }
  </section>

  <!-- 她发出去的东西（干得怎么样） -->
  ${(d.published ?? []).length ? `
  <section>
    <h2><span class="bar"></span>她发出去的<span class="cnt">${d.published.length} 条</span></h2>
    <div class="card" style="padding:6px 17px">
      ${d.published.map(p => `
      <div style="display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)">
        <span class="tag" style="flex:none">${esc(p.platform)}·${esc(p.label)}</span>
        <span style="font-size:12.5px;color:var(--fg3);flex:none;white-space:nowrap">${esc(String(p.at||'').slice(5,16).replace('T',' '))}</span>
        <span style="font-size:13px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.note || p.target || '')}</span>
      </div>`).join('')}
    </div>
  </section>` : ''}

  <!-- 给你的视频建议 -->
  ${(d.videoSuggestions ?? []).length ? `
  <section>
    <h2><span class="bar"></span>给你的视频建议<span class="cnt">${d.videoSuggestions.length} 条</span></h2>
    <div class="grid g2">
      ${d.videoSuggestions.map(v => `
      <div class="card">
        <h3>🎬 ${esc(v.title ?? '')}</h3>
        ${v.url ? `<p class="mono" style="font-size:12px;margin-bottom:8px"><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.url)}</a></p>` : ''}
        ${v.why ? `<p style="font-size:13px;line-height:1.75;margin-bottom:8px"><b style="color:var(--accent)">为什么适合你：</b>${esc(v.why)}</p>` : ''}
        ${v.action ? `<p style="font-size:13px;line-height:1.75;margin-bottom:8px"><b style="color:var(--green)">建议行动：</b>${esc(v.action)}</p>` : ''}
        ${v.prompt ? `<p style="font-size:12.5px;line-height:1.75;color:var(--fg3);border-left:2px solid var(--line);padding-left:10px;margin-top:8px"><b style="color:var(--fg2)">提示方向：</b>${esc(v.prompt)}</p>` : ''}
        ${v.at ? `<p style="font-size:11.5px;color:var(--fg3);margin-top:8px">${esc(String(v.at).slice(0,10))}</p>` : ''}
      </div>`).join('')}
    </div>
  </section>` : ''}

  </div><!-- /col-main -->

  <div class="col-side">
  <!-- 状态自检（侧栏） -->
  <section>
    <h2><span class="bar"></span>状态自检<span class="cnt">${okCount}/${total}</span></h2>
    <div class="card">
      ${d.checks.map(c => `
        <div class="check ${c.ok ? 'ok' : 'no'}">
          <span class="ic">${c.ok ? '✓' : '!'}</span>
          <span class="nm">${esc(c.name)}</span>
          <span class="dt">${esc(c.detail)}</span>
        </div>`).join('')}
    </div>
  </section>

  <!-- 她想说但没说的 -->
  ${d.diary.wants.length ? `
  <section>
    <h2><span class="bar"></span>她想说、还没说的<span class="cnt">${d.diary.wants.length}</span></h2>
    <div class="card">
      <ul style="margin:0;padding-left:19px">
        ${d.diary.wants.map(w => `<li style="font-size:13.5px;color:var(--fg2);margin-bottom:9px;line-height:1.75">${esc(w)}</li>`).join('')}
      </ul>
    </div>
  </section>` : ''}

  <!-- 作息 -->
  <section>
    <h2><span class="bar"></span>作息与开关</h2>
    <div class="grid g3">
      <div class="card">
        <h3>🌙 作息窗口</h3>
        ${(d.schedule.windows ?? []).length
          ? d.schedule.windows.map(w => `<p class="mono" style="font-size:13px">${esc(w.start)} – ${esc(w.end)} · 醒 ${w.wakes} 次</p>`).join('')
          : '<p style="color:var(--fg3)">未配置</p>'}
        <p style="margin-top:9px;font-size:12px;color:var(--fg3)">不看概率 ${Math.round((d.schedule.skipChance ?? 0) * 100)}% · 每轮最多看 ${d.schedule.maxVideos ?? '?'} 条</p>
      </div>
      <div class="card">
        <h3>🔀 当前状态</h3>
        <p style="font-size:13px">掷骰子：<b>${s?.roll === 'skip' ? '今天不看' : s?.roll === 'watch' ? '今天要看' : '未掷'}</b></p>
        <p style="font-size:13px;margin-top:6px">计划：<b>${esc(s?.atText ?? '—')}</b> ${s?.fired ? '（已执行）' : '（未执行）'}</p>
        <p style="font-size:12px;color:var(--fg3);margin-top:9px">窗口 ${esc(s?.window ?? '—')}</p>
      </div>
      <div class="card">
        <h3>⚙️ 对外动作</h3>
        <p style="font-size:13px">分享：<b style="color:${d.switches.share ? 'var(--green)' : 'var(--amber)'}">${d.switches.share ? '开' : '关'}</b>${d.switches.shareVia ? `　方式 ${esc(d.switches.shareVia)}` : ''}</p>
        <p style="font-size:13px;margin-top:6px">评论监听：<b style="color:${d.switches.listenComment ? 'var(--green)' : 'var(--amber)'}">${d.switches.listenComment ? '开' : '关'}</b></p>
        <p style="font-size:13px;margin-top:6px">推送：<b>${esc(d.switches.notify)}</b></p>
        ${warmup ? '<p style="font-size:12px;color:var(--amber);margin-top:9px">养号期：只读不互动，风控最安全</p>' : ''}
      </div>
    </div>
  </section>

  </div><!-- /col-side -->
  </div><!-- /cols -->

  <footer>
    <span>dsh-deepread-bilibili · 数据生成于 ${esc(d.generatedAt.slice(0,19).replace('T',' '))}</span>
    <span>${esc(d.events.length)} 事件 · ${esc(d.diary.watched.length)} 读过 · ${esc(d.diary.queue.length)} 日记</span>
  </footer>`;

  app.innerHTML = html;
  app.style.display = 'block';
  document.getElementById('boot').style.display = 'none';
}

// 事件筛选（内联 onclick 调用，不依赖事件委托）
window.filterEvents = function(f, btn) {
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('on', b === btn));
  let shown = 0;
  document.querySelectorAll('#timeline .ev').forEach(el => {
    const match = (f === 'all' || el.dataset.g === f);
    el.style.display = match ? '' : 'none';
    if (match) shown += 1;
  });
  return shown;
};

// ── 加载数据 ─────────────────────────────────────────────────────
async function boot() {
  const bootEl = document.getElementById('boot');

  // ① 内联数据（单文件双击打开时由 collect.mjs 注入）
  if (window.__DASHBOARD_DATA__) { render(window.__DASHBOARD_DATA__); return; }

  // ② 插件 API（面板跑在 DSH 里时走这条，数据实时、不用管文件）
  try {
    const r = await fetch('/dsh-bili/api/dashboard?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (j.ok && j.data) { render(j.data); return; }
    }
  } catch { /* 不在 DSH 环境，正常，落到 ③ */ }

  // ③ 同目录 data.json（本地起 http.server 时）
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d);
  } catch (e) {
    bootEl.innerHTML = `
      <div class="err">
        读不到 <code>data.json</code>。<br><br>
        这是因为浏览器不允许页面直接读本地文件，需要先生成数据：<br><br>
        <code>node tools/collect.mjs</code><br><br>
        然后刷新本页。<br><br>
        <span style="color:var(--fg3);font-size:12px">（错误：${esc(e.message)}）</span>
      </div>`;
  }
}
boot();
</script>
</body>
</html>
